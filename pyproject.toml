[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-tft-forecasting"
version = "0.1.0"
description = "BTC multi-timeframe forecasting with Temporal Fusion Transformer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "pyarrow>=14.0.0",
  "matplotlib>=3.8.0",
  "scikit-learn>=1.3.0",
  "ccxt>=4.2.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
  "torch>=2.2.0",
  "lightning>=2.2.0",
  "pytorch-forecasting>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
  "artifacts",
  "data",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
